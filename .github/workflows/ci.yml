name: CI

on: [push, pull_request, workflow_call]

permissions:
  contents: read

jobs:
  archive-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tools -p "test_*.py"

  host:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc
          else
            cmake -S . -B build
          fi
      - name: Build (warnings are errors)
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: End-to-end smoke test (simulated terminal + TinyDesk Shell)
        shell: bash
        run: |
          mkdir -p sim && cd sim
          ../build/tdsim wait=300 key=Enter wait=1500 'type=echo tinydesk-ok\r' wait=3000 shot > out.txt
          cat out.txt
          # the command line and its output: two lines
          test "$(grep -c "tinydesk-ok" out.txt)" -ge 2

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd ports/esp32c6
          idf.py set-target esp32c6
          idf.py build
          idf.py size
      - name: Build the classic ESP32 firmware (reuses the C6 components)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          export IDF_COMPONENT_MANAGER=0
          (cd ports/esp32 && idf.py build && idf.py size)
          (cd ports/esp32-4mb && idf.py build && idf.py size)
      - name: Build the TinyDesk Shell firmware (ESP32-C6, ESP32)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          (cd third_party/tdsh && idf.py build)
          (cd third_party/tdsh/projects/esp32 && idf.py build)

  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: TinyDesk Shell host build and tests
        run: |
          sudo apt-get install -y ninja-build
          cmake -S third_party/tdsh -B build-shell -G Ninja -DTDSH_BUILD_HOST=ON
          cmake --build build-shell
          ctest --test-dir build-shell --output-on-failure
